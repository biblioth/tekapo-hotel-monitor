name: Keep scheduled monitor active

on:
  schedule:
    # Public-repository schedules are disabled after 60 days without repository
    # activity. One small monthly heartbeat commit keeps the free monitor active.
    - cron: "31 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record monthly heartbeat
        shell: bash
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/monitor-heartbeat
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/monitor-heartbeat
          git commit -m 'chore: keep scheduled monitor active [skip ci]'
          git push
