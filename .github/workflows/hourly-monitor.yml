name: Hourly hotel monitor

on:
  schedule:
    # GitHub may delay or drop scheduled events. Frequent off-peak candidates
    # improve delivery; the persisted 50-minute gate still permits only one
    # real hotel check per hour.
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:

jobs:
  monitor:
    uses: ./.github/workflows/monitor-core.yml
    with:
      trigger_kind: ${{ github.event_name }}
    secrets: inherit
