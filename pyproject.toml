[project]
name = "tekapo-hotel-monitor"
version = "1.1.2"
description = "Quiet hotel availability monitor with deduplicated Feishu and WeChat alerts"
requires-python = ">=3.12"
dependencies = [
  "apscheduler>=3.10,<4",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "playwright>=1.50,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
